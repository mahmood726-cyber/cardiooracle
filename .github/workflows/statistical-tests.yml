name: Statistical correctness tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r curate/requirements.txt pytest
      - name: Run deterministic unit and regression tests
        run: |
          python -m pytest -q tests/test_curation.py tests/test_reproducibility.py tests/test_temporal_validation.py tests/test_validation_notice.py backtest/test_backtest.py
